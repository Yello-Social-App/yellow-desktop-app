appId: com.yello.desktop
productName: Yello
copyright: Copyright © 2026 Yello

directories:
  output: release
  buildResources: build

# asar keeps app sources in a single archive: faster cold start and fewer loose files.
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

electronLanguages:
  - en-US

mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icons/icon.png

win:
  target:
    - nsis
  icon: build/icons/icon.png

# One installer per packaging family, so every mainstream distribution has a
# native package: deb (Debian, Ubuntu, Mint), rpm (Fedora, openSUSE, RHEL),
# pacman (Arch, Manjaro, EndeavourOS), and AppImage for everything else.
# rpm needs `rpmbuild` and pacman needs `bsdtar` on the build host — the
# release workflow installs both.
linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  category: Network
  icon: build/icons/icon.png
  # Ties a running window to the .desktop entry, so the launcher shows the app
  # under its own name and icon rather than as a generic Electron window.
  syncDesktopName: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Update artifacts are signature-checked by electron-updater before they are
# applied (OWASP A08). GitHub Releases is the feed: electron-updater reads the
# same release the CI matrix uploads to, so the app updates from exactly the
# artifacts that were built for a tag.
#
# `releaseType: draft` is deliberate. Three OS jobs upload to one release, and a
# release published on the first upload would be public while still missing two
# platforms' installers. The workflow flips it to published once every job has
# finished — see .github/workflows/release.yml.
publish:
  provider: github
  owner: Yello-Social-App
  repo: yellow-desktop-app
  releaseType: draft
